name: Build UpdateBlocker123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and Theos
        shell: bash
        run: |
          set -e
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          brew update
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list xz >/dev/null 2>&1 || brew install xz
          brew list dpkg >/dev/null 2>&1 || brew install dpkg

          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

          which ldid
          ldid -v || true

      - name: Build rootful package
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"

          make clean || true
          make package FINALPACKAGE=1

          mkdir -p out/rootful
          find packages -name "*.deb" -exec cp -v {} out/rootful/ \; || true
          find .theos -name "*.dylib" -exec cp -v {} out/rootful/ \; || true

      - name: Build rootless package
        shell: bash
        run: |
          set -e
          export THEOS="$HOME/theos"

          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

          mkdir -p out/rootless
          find packages -name "*.deb" -exec cp -v {} out/rootless/ \; || true
          find .theos -name "*.dylib" -exec cp -v {} out/rootless/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UpdateBlocker123-build
          path: out/**
          if-no-files-found: error
